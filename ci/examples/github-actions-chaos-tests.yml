name: chaos-tests

on:
  workflow_dispatch:
  pull_request:

jobs:
  chaos-tests:
    runs-on: ubuntu-latest
    env:
      CHAOS_MESH_DRY_RUN: "0"
      CHAOS_NAMESPACE: chaos-testing
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install -r requirements-chaos.txt
      - name: Install Chaos Mesh
        run: ./scripts/install-chaos-mesh.sh
      - name: Deploy sniproxy
        run: |
          kubectl apply -f k8s/sniproxy/namespace.yaml
          kubectl apply -f k8s/sniproxy/configmap.yaml
          kubectl apply -f k8s/sniproxy/deployment.yaml
          kubectl apply -f k8s/sniproxy/service.yaml
      - name: Run chaos examples
        run: pytest tests/test_chaos_examples.py -q
      - name: Cleanup chaos experiments
        if: always()
        run: ./scripts/cleanup-chaos-experiments.sh
