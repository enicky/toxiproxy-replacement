apiVersion: v1
kind: ConfigMap
metadata:
  name: sniproxy-config
  namespace: sniproxy
data:
  sniproxy.conf: |
    user daemon
    pidfile /tmp/sniproxy.pid

    error_log {
        filename /dev/stderr
        priority notice
    }

    listen 443 {
        proto tls
        table https_hosts
        fallback config-service.example.com:443

        access_log {
            filename /dev/stdout
            priority notice
        }
    }

    listen 8883 {
        proto tls
        table mqtt_hosts
        fallback mqtt-hub.azure.example.com:8883

        access_log {
            filename /dev/stdout
            priority notice
        }
    }

    table https_hosts {
        config-service.example.com config-service.example.com:443
        web-gateway.example.com web-gateway.example.com:443
        internal-api.local 10.40.4.8:443
        partner-api.example.com partner-api.example.com:443
    }

    table mqtt_hosts {
        mqtt-hub.azure.example.com mqtt-hub.azure.example.com:8883
    }
