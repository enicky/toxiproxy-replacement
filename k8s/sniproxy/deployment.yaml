apiVersion: apps/v1
kind: Deployment
metadata:
  name: sniproxy
  namespace: sniproxy
  labels:
    app.kubernetes.io/name: sniproxy
    app.kubernetes.io/component: tcp-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sniproxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sniproxy
        app.kubernetes.io/component: tcp-proxy
    spec:
      containers:
        - name: sniproxy
          image: ghcr.io/enicky/toxiproxy-replacement/sniproxy:latest
          imagePullPolicy: IfNotPresent
          args:
            - -f
            - -c
            - /etc/sniproxy/sniproxy.conf
          ports:
            - name: https
              containerPort: 443
            - name: mqtt-tls
              containerPort: 8883
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/sniproxy
              readOnly: true
            - name: tmp
              mountPath: /tmp
      securityContext:
        runAsNonRoot: true
        runAsUser: 1
        runAsGroup: 1
        fsGroup: 1
      volumes:
        - name: config
          configMap:
            name: sniproxy-config
            items:
              - key: sniproxy.conf
                path: sniproxy.conf
        - name: tmp
          emptyDir: {}
