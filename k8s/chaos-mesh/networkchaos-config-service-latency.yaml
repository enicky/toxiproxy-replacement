apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: config-service-latency
  namespace: chaos-testing
spec:
  action: delay
  mode: all
  duration: 5m
  selector:
    namespaces:
      - app-test
    labelSelectors:
      app.kubernetes.io/name: dotnet-client
  direction: to
  externalTargets:
    - config-service.example.com
  delay:
    latency: 500ms
    correlation: "25"
    jitter: 50ms
