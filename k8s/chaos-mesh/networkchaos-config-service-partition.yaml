apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: config-service-partition
  namespace: chaos-testing
spec:
  action: partition
  mode: all
  duration: 5m
  selector:
    namespaces:
      - app-test
    labelSelectors:
      app.kubernetes.io/name: dotnet-client
  direction: to
  externalTargets:
    - config-service.example.com
