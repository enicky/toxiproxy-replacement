apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: sniproxy-latency
  namespace: chaos-testing
spec:
  action: delay
  mode: all
  duration: 5m
  selector:
    namespaces:
      - app-test
    labelSelectors:
      app.kubernetes.io/name: dotnet-client
  delay:
    latency: 100ms
    correlation: "25"
    jitter: 10ms
