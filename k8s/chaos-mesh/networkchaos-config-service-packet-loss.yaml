apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: config-service-packet-loss
  namespace: chaos-testing
spec:
  action: loss
  mode: all
  duration: 5m
  selector:
    namespaces:
      - app-test
    labelSelectors:
      app.kubernetes.io/name: dotnet-client
  direction: to
  externalTargets:
    - config-service.example.com
  loss:
    loss: "50"
    correlation: "25"
