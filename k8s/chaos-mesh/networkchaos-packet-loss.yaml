apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: sniproxy-packet-loss
  namespace: chaos-testing
spec:
  action: loss
  mode: all
  duration: 5m
  selector:
    namespaces:
      - app-test
    labelSelectors:
      app.kubernetes.io/name: dotnet-client
  loss:
    loss: "30"
    correlation: "25"
