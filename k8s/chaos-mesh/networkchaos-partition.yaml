apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: sniproxy-partition
  namespace: chaos-testing
spec:
  action: partition
  mode: all
  duration: 5m
  selector:
    namespaces:
      - app-test
    labelSelectors:
      app.kubernetes.io/name: dotnet-client
  direction: to
  target:
    mode: all
    selector:
      namespaces:
        - sniproxy
      labelSelectors:
        app.kubernetes.io/name: sniproxy
